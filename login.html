<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Log In — Stackly Resorts</title>

  <style>
    /* =========================================================
   MAREJADA — coastal resort booking platform
   Design tokens
   ========================================================= */
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Sora:wght@300;400;500;600;700&display=swap');

:root{
  /* palette */
  --ink:#0E2A2B;
  --teal:#17494A;
  --teal-light:#2C6B6C;
  --sand:#bf8527;
  --sand-deep:#eaa118;
  --coral:#040404;
  --coral-dark:#C6572A;
  --seafoam:#00ef30;
  --white:#FBF8F3;
  --text-dark:#12211F;
  --text-soft:#4B5B58;
  --text-light:#ffba18;

  --font-display:'Fraunces', serif;
  --font-body:'Sora', sans-serif;

  --radius-sm:6px;
  --radius-md:14px;
  --radius-lg:28px;

  --shadow-soft:0 20px 50px -25px rgba(14,42,43,0.35);
  --shadow-lift:0 30px 60px -20px rgba(14,42,43,0.45);

  --ease:cubic-bezier(.22,1,.36,1);
}

*,*::before,*::after{box-sizing:border-box;}

/* ---- global overflow guard ----
   html needs the same overflow-x:hidden as body: the page's horizontal
   scrollbar is driven by whichever of the two is wider, so setting it
   only on body (as before) still let a stray wide element scroll the page. */
html,body{
  overflow-x:hidden;
  width:100%;
  max-width:100%;
  scroll-behavior:smooth;
}
body{
  margin:0;
  font-family:var(--font-body);
  color:var(--text-dark);
  background:var(--white);
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
ul{list-style:none;margin:0;padding:0;}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;line-height:1.05;font-weight:600;color:var(--ink);word-wrap:break-word;overflow-wrap:break-word;}
p{margin:0;color:var(--text-soft);line-height:1.7;word-wrap:break-word;overflow-wrap:break-word;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;max-width:100%;}

.eyebrow{
  font-family:var(--font-body);
  text-transform:uppercase;
  letter-spacing:.18em;
  font-size:.72rem;
  font-weight:600;
  color:var(--coral-dark);
  display:inline-flex;
  align-items:center;
  gap:.55em;
}
.eyebrow::before{
  content:"";
  width:22px;height:1px;
  background:var(--coral-dark);
  display:inline-block;
}

.container{
  width:100%;
  max-width:1220px;
  margin:0 auto;
  padding:0 clamp(20px,5vw,56px);
}

/* focus visibility */
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{
  outline:2px solid var(--coral);
  outline-offset:3px;
  border-radius:4px;
}

/* =========================================================
   BUTTONS
   ========================================================= */
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:.6em;
  padding:.95em 1.9em;
  border-radius:100px;
  font-size:.88rem;
  font-weight:600;
  letter-spacing:.01em;
  border:1px solid transparent;
  transition:transform .45s var(--ease), background .3s ease, color .3s ease, box-shadow .3s ease, border-color .3s ease;
  white-space:nowrap;
  max-width:100%;
}
.btn-primary{
  background:var(--coral);
  color:var(--white);
  box-shadow:0 14px 30px -12px rgba(232,112,58,.65);
}
.btn-primary:hover{background:var(--coral-dark); transform:translateY(-2px);}
.btn-outline{
  background:transparent;
  border-color:rgba(18,33,31,.22);
  color:var(--ink);
}
.btn-outline:hover{border-color:var(--ink); transform:translateY(-2px);}
.btn-outline-light{
  background:transparent;
  border-color:rgba(255,255,255,.4);
  color:var(--text-light);
}
.btn-outline-light:hover{border-color:#fff; background:rgba(255,255,255,.08); transform:translateY(-2px);}
.btn-ghost{
  background:transparent;
  color:var(--ink);
  padding:.4em 0;
  border-bottom:1px solid rgba(18,33,31,.35);
  border-radius:0;
}
.btn-ghost:hover{border-color:var(--coral); color:var(--coral-dark);}
.btn-block{width:100%;}

/* =========================================================
   HEADER / NAV
   ========================================================= */
.site-header{
  position:fixed;
  top:0;left:0;right:0;
  z-index:1000;
  padding:18px 0;
  transition:background .4s var(--ease), padding .4s var(--ease), box-shadow .4s var(--ease);
}
.site-header .container{
  position:relative;
  z-index:1001;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
}
.site-header.is-scrolled{
  background:rgba(251,248,243,.92);
  backdrop-filter:blur(10px);
  padding:10px 0;
  box-shadow:0 10px 30px -20px rgba(14,42,43,.4);
}
.brand{
  display:flex;
  align-items:center;
  gap:.6em;
  font-family:var(--font-display);
  font-weight:600;
  font-size:1.35rem;
  line-height:1;
  color:var(--text-light);
  transition:color .4s ease;
  min-width:0;
  width: 200px;
  height: 60px;
  cursor: pointer;
}
.brand img{
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.site-header.is-scrolled .brand{color:var(--ink);}
.brand .dot{
  width:9px;height:9px;border-radius:50%;
  background:var(--coral);
  box-shadow:0 0 0 5px rgba(232,112,58,.2);
  flex-shrink:0;
}
.nav-links{
  display:flex;
  align-items:center;
  gap:2.3em;
}
.nav-links a{
  font-size:.86rem;
  font-weight:500;
  color:var(--text-light);
  position:relative;
  padding:.3em 0;
  transition:color .4s ease;
}
.site-header.is-scrolled .nav-links a{color:var(--text-dark);}
.nav-links a::after{
  content:"";
  position:absolute;left:0;right:100%;bottom:-2px;
  height:1.5px;background:var(--coral);
  transition:right .35s var(--ease);
}
.nav-links a:hover::after,.nav-links a.active::after{right:0;}
.nav-links a.active{color:var(--coral);}
.site-header.is-scrolled .nav-links a.active{color:var(--coral-dark);}

.nav-actions{display:flex;align-items:center;gap:.9em;}
.nav-actions .btn{padding:.75em 1.5em;}
.icon-btn-login{color:var(--text-light);}
.site-header.is-scrolled .icon-btn-login{color:var(--text-dark);}

.nav-toggle{
  display:none;
  position:relative;
  z-index:1001;
  width:42px;height:42px;
  flex-shrink:0;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.4);
  background:transparent;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  padding:0;
  transition:border-color .4s ease;
}
.site-header.is-scrolled .nav-toggle{border-color:rgba(18,33,31,.3);}
.nav-toggle span{
  width:18px;height:1.5px;background:var(--text-light);
  transition:transform .35s var(--ease), opacity .3s ease, background .4s ease;
}
.site-header.is-scrolled .nav-toggle span{background:var(--text-dark);}
.nav-toggle.is-open span:nth-child(1){transform:translateY(6.5px) rotate(45deg);background-color: white;}
.nav-toggle.is-open span:nth-child(2){opacity:0;background-color: white;}
.nav-toggle.is-open span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg);background-color: white;}

/* mobile menu panel — hidden by default so it never leaks into desktop layout.
   The @media block below switches it to display:flex and handles the
   open/close animation via the .is-open class. */
.mobile-menu{
  display:none;
}

/* =========================================================
   HERO (dark banded pages use .hero--page)
   ========================================================= */
.hero{
  position:relative;
  min-height:100vh;
  display:flex;
  align-items:center;
  color:var(--text-light);
  background:linear-gradient(180deg,rgba(10,30,31,.35),rgba(10,30,31,.75)), var(--ink);
  background-size:cover;
  background-position:center;
  overflow:hidden;
  width:100%;
}
.hero::before{
  content:"";
  position:absolute; inset:0;
  background:radial-gradient(60% 60% at 80% 10%, rgba(232,112,58,.22), transparent 60%);
  pointer-events:none;
}
.hero-content{position:relative;z-index:2;padding-top:110px;padding-bottom:70px;}
.hero-content .eyebrow{color:var(--seafoam);}
.hero-content .eyebrow::before{background:var(--seafoam);}
.hero h1{
  font-size:clamp(2.6rem,6vw,4.6rem);
  color:var(--text-light);
  margin:.4em 0 .35em;
  max-width:15ch;
}
.hero h1 em{font-style:italic;color:var(--coral);font-weight:400;}
.hero p.lead{
  color:rgba(245,241,232,.82);
  font-size:1.08rem;
  max-width:44ch;
  margin-bottom:2em;
}
.hero-actions{display:flex;gap:1em;flex-wrap:wrap;}

/* page hero (smaller, for interior pages) */
.hero--page{min-height:64vh;}
.hero--page .hero-content{padding-top:130px;padding-bottom:90px;}
.hero--page h1{max-width:20ch;font-size:clamp(2.3rem,5vw,3.6rem);}

/* booking widget overlapping hero */
.booking-widget{
  position:relative;
  z-index:3;
  margin-top:-46px;
  background:var(--white);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lift);
  padding:clamp(20px,3vw,34px);
  display:grid;
  grid-template-columns:repeat(4,1fr) auto;
  gap:18px;
  align-items:end;
  max-width:100%;
}
.booking-field{display:flex;flex-direction:column;gap:.5em;min-width:0;}
.booking-field label{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;font-weight:600;color:var(--teal);}
.booking-field input,.booking-field select{
  border:none;border-bottom:1.5px solid rgba(18,33,31,.18);
  padding:.5em .1em;
  background:transparent;
  font-size:.95rem;color:var(--text-dark);
  transition:border-color .3s ease;
  width:100%;
}
.booking-field input:focus,.booking-field select:focus{border-color:var(--coral); outline:none;}

/* =========================================================
   WAVE DIVIDER — signature motif
   ========================================================= */
.wave{
  width:100%;
  height:64px;
  display:block;
  position:relative;
  overflow:hidden; /* the animated svg inside is 200% wide by design — without
                       this the extra width scrolled the whole page sideways */
}
.wave svg{width:200%;height:100%;animation:tide 18s linear infinite;}
@keyframes tide{
  from{transform:translateX(0);}
  to{transform:translateX(-50%);}
}
.wave--ink svg path{fill:var(--ink);}
.wave--sand svg path{fill:var(--sand);}
.wave--white svg path{fill:var(--white);}
.wave--teal svg path{fill:var(--teal);}
.wave--up{transform:rotate(180deg);}

/* =========================================================
   SECTIONS
   ========================================================= */
.section{padding:clamp(60px,9vw,120px) 0; overflow:hidden;}
.section-sand{background:var(--sand);}
.section-ink{background:var(--ink); color:var(--text-light);}
.section-ink h2,.section-ink h3{color:var(--text-light);}
.section-ink p{color:rgba(245,241,232,.75);}
.section-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:30px;
  margin-bottom:3em;
  flex-wrap:wrap;
}
.section-head h2{font-size:clamp(1.9rem,4vw,2.7rem); max-width:14ch; margin-top:.3em;}
.section-head p{max-width:38ch;}

/* reveal-on-scroll */
.reveal{opacity:0;transform:translateY(28px);transition:opacity .8s var(--ease), transform .8s var(--ease);}
.reveal.is-visible{opacity:1;transform:translateY(0);}
.reveal-stagger > *{opacity:0;transform:translateY(24px);transition:opacity .7s var(--ease), transform .7s var(--ease);}
.reveal-stagger.is-visible > *{opacity:1;transform:translateY(0);}
.reveal-stagger.is-visible > *:nth-child(1){transition-delay:.05s;}
.reveal-stagger.is-visible > *:nth-child(2){transition-delay:.15s;}
.reveal-stagger.is-visible > *:nth-child(3){transition-delay:.25s;}
.reveal-stagger.is-visible > *:nth-child(4){transition-delay:.35s;}

/* =========================================================
   CARDS — suites / services / blog
   ========================================================= */
.grid{display:grid;gap:28px;min-width:0;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
.team{
 grid-template-columns:repeat(4,1fr);
}
.suite-card{
  position:relative;
  border-radius:var(--radius-md);
  overflow:hidden;
  background:var(--white);
  box-shadow:var(--shadow-soft);
  transition:transform .5s var(--ease), box-shadow .5s var(--ease);
  min-width:0;
}
.suite-card:hover{transform:translateY(-8px); box-shadow:var(--shadow-lift);}
.suite-card .media{aspect-ratio:4/3;overflow:hidden;}
.suite-card .media img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease);}
.suite-card:hover .media img{transform:scale(1.08);}
.suite-card .body{padding:24px;}
.suite-card .price{color:var(--coral-dark);font-weight:600;font-family:var(--font-display);font-size:1.2rem;}
.suite-card .tags{display:flex;gap:.6em;margin-top:.8em;flex-wrap:wrap;}
.tag{
  font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;
  padding:.35em .8em;border-radius:100px;
  background:var(--sand);color:var(--teal);font-weight:600;
}

.service-card{
  padding:32px 26px;
  border-radius:var(--radius-md);
  background:var(--white);
  border:1px solid rgba(18,33,31,.08);
  transition:transform .45s var(--ease), border-color .45s ease, box-shadow .45s ease;
  min-width:0;
}
.service-card:hover{transform:translateY(-6px); border-color:transparent; box-shadow:var(--shadow-soft);}
.service-card .num{
  font-family:var(--font-display);font-style:italic;color:var(--seafoam);
  font-size:1rem;
}
.service-icon{
  width:52px;height:52px;border-radius:50%;
  background:var(--sand);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:1.2em;
  transition:background .4s ease, transform .4s ease;
}
.service-card:hover .service-icon{background:var(--coral);transform:rotate(-8deg) scale(1.05);}
.service-icon svg{width:24px;height:24px;stroke:var(--teal);transition:stroke .4s ease;}
.service-card:hover .service-icon svg{stroke:var(--white);}

.blog-card{
  border-radius:var(--radius-md);
  overflow:hidden;
  background:var(--white);
  box-shadow:var(--shadow-soft);
  transition:transform .5s var(--ease), box-shadow .5s var(--ease);
  min-width:0;
}
.blog-card:hover{transform:translateY(-8px);box-shadow:var(--shadow-lift);}
.blog-card .media{aspect-ratio:16/10;overflow:hidden;}
.blog-card .media img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease);}
.blog-card:hover .media img{transform:scale(1.07);}
.blog-card .body{padding:22px 24px 26px;}
.blog-card .meta{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--coral-dark);font-weight:600;margin-bottom:.8em;display:block;}
.blog-card h3{font-size:1.2rem;margin-bottom:.5em;}
.blog-card .excerpt{font-size:.92rem;margin-bottom:1.1em;}
.blog-card .read{font-size:.82rem;font-weight:600;color:var(--teal);display:inline-flex;align-items:center;gap:.4em;}
.blog-card .read svg{width:14px;height:14px;transition:transform .35s var(--ease);}
.blog-card:hover .read svg{transform:translateX(4px);}

/* =========================================================
   STATS
   ========================================================= */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;min-width:0;}
.stat{min-width:0;}
.stat h3{font-size:clamp(2.2rem,4vw,3rem);color:var(--coral);}
.stat span{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:rgba(245,241,232,.65);font-weight:600;}

/* =========================================================
   TESTIMONIALS
   ========================================================= */
.testimonial-track{
  position:relative;
  overflow:hidden;
}
.testimonial-slide{
  display:none;
  text-align:center;
  max-width:680px;
  margin:0 auto;
}
.testimonial-slide.is-active{display:block;animation:fadeUp .7s var(--ease);}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
.testimonial-slide p{font-family:var(--font-display);font-style:italic;font-size:clamp(1.2rem,2.4vw,1.6rem);color:var(--ink);margin-bottom:1em;}
.testimonial-slide .who{font-size:.82rem;font-weight:600;color:var(--teal);letter-spacing:.03em;}
.testimonial-dots{display:flex;justify-content:center;gap:.6em;margin-top:2em;}
.testimonial-dots button{
  width:8px;height:8px;border-radius:50%;border:none;background:rgba(18,33,31,.2);
  transition:background .3s ease, transform .3s ease;
}
.testimonial-dots button.is-active{background:var(--coral); transform:scale(1.3);}

/* =========================================================
   CTA BANNER
   ========================================================= */
.cta-banner{
  border-radius:var(--radius-lg);
  background:var(--teal);
  color:var(--text-light);
  padding:clamp(40px,6vw,72px);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:30px;
  flex-wrap:wrap;
  position:relative;
  overflow:hidden;
}
.cta-banner::after{
  content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle, rgba(232,112,58,.35), transparent 70%);
}
.cta-banner h2{color:var(--text-light);max-width:14ch;font-size:clamp(1.7rem,3.5vw,2.4rem);}

/* =========================================================
   FOOTER
   ========================================================= */
.site-footer{background:var(--ink);color:rgb(255, 255, 255);padding-top:70px;overflow:hidden;}
.footer-grid{
  display:grid;
  grid-template-columns:1.4fr 1fr 1fr 1.2fr;
  gap:40px;
  padding-bottom:50px;
  border-bottom:1px solid rgba(245,241,232,.12);
  color: white;
  min-width:0;
}
.footer-grid h4{color:var(--text-light);font-size:.95rem;margin-bottom:1.2em;font-family:var(--font-body);font-weight:600;letter-spacing:.03em;}
.footer-grid .brand{color:var(--text-light);margin-bottom:.9em;}
.footer-grid p{font-size:.9rem;max-width:32ch; color: white;}
.footer-links li{margin-bottom:.75em;}
.footer-links a{font-size:.9rem;transition:color .3s ease, padding-left .3s ease;}
.footer-links a:hover{color:white;padding-left:4px;}
.footer-social{display:flex;gap:.8em;margin-top:1.4em;flex-wrap:wrap;}
.footer-social a{
  width:36px;height:36px;border-radius:50%;border:1px solid rgba(245,241,232,.2);
  display:flex;align-items:center;justify-content:center;
  transition:background .3s ease, border-color .3s ease, transform .3s ease;
  flex-shrink:0;
}
.footer-social a:hover{background:var(--coral);border-color:var(--coral);transform:translateY(-3px);}
.footer-social svg{width:15px;height:15px;stroke:var(--text-light);}
.footer-bottom{
  display:flex;justify-content:space-between;align-items:center;
  padding:22px 0 30px;font-size:.78rem;flex-wrap:wrap;gap:10px;
  color:rgba(245,241,232,.5);
}

/* =========================================================
   AUTH PAGES
   ========================================================= */
.auth-shell{
  min-height:100vh;
  display:grid;
  grid-template-columns:1fr 1fr;
  overflow:hidden;
}
.auth-visual{
  position:relative;
  background:linear-gradient(200deg, var(--ink), var(--teal));
  color:var(--text-light);
  padding:60px;
  display:flex;
  flex-direction:column;
  justify-content:space-around;
  overflow:hidden;
  background: url("./src/home/image-6-compressed.webp");
  background-repeat: no-repeat;
  background-size: cover;
  background-position: center;
  opacity: 0.8;
}
.auth-visual::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(50% 50% at 20% 85%, rgba(232,112,58,.28), transparent 70%);
}
.auth-visual .quote{position:relative;z-index:1;max-width:26ch;}
.auth-visual .quote p{font-family:var(--font-display);font-style:italic;font-size:1.5rem;color:var(--text-light);margin-bottom:.6em;}
.auth-visual .quote span{font-size:.8rem;color:var(--seafoam);letter-spacing:.05em;}

.auth-form-wrap{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:60px 40px;
  min-width:0;
}
.auth-form{width:100%;max-width:400px;}
.auth-form .brand{color:var(--ink);margin-bottom:2.2em;}
.auth-form h1{font-size:2rem;margin-bottom:.3em;}
.auth-form > p.sub{margin-bottom:2em;}
.field{margin-bottom:1.3em;position:relative;}
.field label{display:block;font-size:.76rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--teal);margin-bottom:.6em;}
.field input{
  width:100%;padding:.9em 1em;
  border:1.5px solid rgba(18,33,31,.15);
  border-radius:var(--radius-sm);
  font-size:.95rem;
  transition:border-color .3s ease, box-shadow .3s ease;
  background:var(--white);
}
.field input:focus{border-color:var(--coral); outline:none; box-shadow:0 0 0 4px rgba(232,112,58,.12);}
.field input.is-invalid{border-color:#C6392E;}
.field .error-msg{

}

.strength-meter span{height:4px;flex:1;background:rgba(18,33,31,.12);border-radius:3px;transition:background .3s ease;}

/* toast — clamp so it can't push past the viewport edge on narrow screens */
.toast{
  position:fixed;bottom:26px;right:26px;z-index:2000;
  background:var(--ink);color:var(--text-light);
  padding:16px 22px;border-radius:var(--radius-sm);
  box-shadow:var(--shadow-lift);
  display:flex;align-items:center;gap:.8em;font-size:.88rem;
  transform:translateY(140%);opacity:0;
  transition:transform .5s var(--ease), opacity .5s var(--ease);
  max-width:calc(100vw - 32px);
}
.toast.show{transform:translateY(0);opacity:1;}
.toast .dot{width:8px;height:8px;border-radius:50%;background:var(--seafoam);flex-shrink:0;}

/* =========================================================

   ========================================================= */
.filter-row{display:flex;gap:.7em;flex-wrap:wrap;margin-bottom:2.8em;}
.filter-btn{

  background:transparent;font-size:.82rem;font-weight:600;color:var(--text-soft);
  transition:all .3s ease;
}
.filter-btn.is-active,.filter-btn:hover{background:var(--ink); color:var(--text-light); border-color:var(--ink);}

.contact-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:50px;align-items:start;min-width:0;}
.info-card{
  display:flex;gap:1em;padding:22px;border-radius:var(--radius-md);background:var(--white);
  box-shadow:var(--shadow-soft);margin-bottom:16px;
  transition:transform .4s var(--ease);
  min-width:0;
}
.info-card:hover{transform:translateX(6px);}
.info-card svg{width:22px;height:22px;stroke:var(--coral-dark);flex-shrink:0;}
.info-card h4{font-size:.95rem;margin-bottom:.3em;}
.info-card p{font-size:.85rem;}
.map-frame{
  border-radius:var(--radius-md);overflow:hidden;height:220px;
  background:linear-gradient(120deg,var(--teal),var(--ink));

}
.faq-item{border-bottom:1px solid rgba(18,33,31,.12);padding:20px 0;}

}
.faq-q .plus{transition:transform .35s var(--ease);font-size:1.3rem;color:var(--coral);flex-shrink:0;}
.faq-item.is-open .faq-q .plus{transform:rotate(45deg);}
.faq-a{max-height:0;overflow:hidden;transition:max-height .4s var(--ease);}
.faq-item.is-open .faq-a{max-height:200px;}
.faq-a p{padding-top:14px;font-size:.92rem;}

/* =========================================================
   ABOUT extras
   ========================================================= */
.split{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center;min-width:0;}
.split > *{min-width:0;}
.timeline{border-left:2px solid rgba(18,33,31,.12);padding-left:30px;}
.timeline-item{position:relative;padding-bottom:36px;}
.timeline-item:last-child{padding-bottom:0;}
.timeline-item::before{
  content:"";position:absolute;left:-36px;top:2px;width:10px;height:10px;border-radius:50%;
  background:var(--coral);box-shadow:0 0 0 4px rgba(232,112,58,.18);
}
.timeline-item .yr{font-family:var(--font-display);font-style:italic;color:var(--teal);font-size:1.1rem;margin-bottom:.3em;display:block;}

.team-card{text-align:center;min-width:0;}

.team-card .media img{width:100%;height:100%;object-fit:cover;}
.team-card h4{font-size:1.02rem;}
.team-card span{font-size:.78rem;color:var(--coral-dark);font-weight:600;letter-spacing:.04em;}

/* =========================================================
   GALLERY
   ========================================================= */
.gallery-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  grid-auto-rows:120px;
  gap:16px;
  min-width:0;
}
.gallery-item{
  position:relative;
  border-radius:var(--radius-md);
  overflow:hidden;
  min-width:0;
}
.gallery-item img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease);}
.gallery-item:hover img{transform:scale(1.09);}
.gallery-item::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 55%, rgba(14,42,43,.55));
  opacity:0;transition:opacity .4s ease;
}
.gallery-item:hover::after{opacity:1;}
.gallery-item span{
  position:absolute;left:16px;bottom:14px;color:var(--text-light);
  font-size:.78rem;font-weight:600;letter-spacing:.03em;
  opacity:0;transform:translateY(8px);transition:opacity .4s ease, transform .4s ease;
}
.gallery-item:hover span{opacity:1;transform:translateY(0);}
.gallery-item.big{grid-column:span 2;grid-row:span 2;}
.gallery-item.tall{grid-row:span 2;}

/* =========================================================

.amenity-strip{

  .mobile-menu.is-open .mobile-menu-actions{opacity:1;transform:translateX(0);}
.mobile-btn{

<div class="auth-shell">

<script>
  /* =====================================================
   STACKLY LOGIN
===================================================== */


/* =====================================================
   LOGIN FORM
===================================================== */

const loginForm = document.getElementById('loginForm');

if (loginForm) {

    loginForm.addEventListener('submit', function (e) {

        e.preventDefault();

        let valid = true;


        /* ---------------------------------------------
           GET ELEMENTS
        --------------------------------------------- */

        const email =
            document.getElementById('l-email');

        const password =
            document.getElementById('l-password');

        const role =
            document.getElementById('l-role');

        const rememberMe =
            document.getElementById('rememberMe');


        const emailField =
            document.getElementById('loginEmailField');

        const passwordField =
            document.getElementById('loginPasswordField');


        const emailError =
            emailField.querySelector('.error-msg');

        const passwordError =
            passwordField.querySelector('.error-msg');


        const loginMsg =
            document.getElementById('loginMsg');

        const loginMsgText =
            loginMsg.querySelector('span');


        /* ---------------------------------------------
           CLEAR OLD ERRORS
        --------------------------------------------- */

        emailError.textContent = '';
        passwordError.textContent = '';

        emailField.classList.remove('has-error');
        passwordField.classList.remove('has-error');

        loginMsg.classList.remove('show', 'error');

        loginMsgText.textContent = '';


        /* =================================================
           EMAIL VALIDATION
        ================================================= */

        const emailValue =
            email.value.trim();


        if (emailValue === '') {

            valid = false;

            emailError.textContent =
                'Email is required.';

            emailField.classList.add('has-error');

        }

        else {

            const emailPattern =
                /^[^\s@]+@[^\s@]+\.(com|in|gov|org|net)$/i;


            if (!emailPattern.test(emailValue)) {

                valid = false;

                emailError.textContent =
                    'Enter a valid email address.';

                emailField.classList.add('has-error');

            }

        }


        /* =================================================
           PASSWORD VALIDATION
        ================================================= */

        const passwordValue =
            password.value;


        if (passwordValue.trim() === '') {

            valid = false;

            passwordError.textContent =
                'Password is required.';

            passwordField.classList.add('has-error');

        }

        else if (passwordValue.length < 6) {

            valid = false;

            passwordError.textContent =
                'Password must be at least 6 characters.';

            passwordField.classList.add('has-error');

        }


        /* =================================================
           LOGIN SUCCESS
        ================================================= */

        if (valid) {


            /* ---------------------------------------------
               GET SELECTED ROLE
            --------------------------------------------- */

            const selectedRole =
                role.value;


            /* ---------------------------------------------
               SAVE USER EMAIL
            --------------------------------------------- */

            localStorage.setItem(
                'stacklyUserEmail',
                emailValue
            );


            /* ---------------------------------------------
               SAVE USER ROLE
            --------------------------------------------- */

            localStorage.setItem(
                'stacklyUserRole',
                selectedRole
            );


            /* ---------------------------------------------
               REMEMBER ME
            --------------------------------------------- */

            localStorage.setItem(
                'rememberMe',
                rememberMe.checked
            );


            /* ---------------------------------------------
               SAVE LOGIN STATUS
            --------------------------------------------- */

            localStorage.setItem(
                'stacklyLoggedIn',
                'true'
            );


            /* ---------------------------------------------
               SUCCESS MESSAGE
            --------------------------------------------- */

            loginMsg.classList.add('show');

            loginMsgText.textContent =
                'Login successful! Redirecting...';


            /* ---------------------------------------------
               REDIRECT
            --------------------------------------------- */

            setTimeout(function () {

                if (selectedRole === 'admin') {

                    window.location.href =
                        'admin.html';

                }

                else {

                    window.location.href =
                        'user.html';

                }

            }, 900);

        }

    });

}


/* =====================================================
   PASSWORD SHOW / HIDE
===================================================== */

const passwordToggle =
    document.querySelector('.toggle-pw');

if (passwordToggle) {

    passwordToggle.addEventListener('click', function () {

        const password =
            document.getElementById('l-password');


        if (password.type === 'password') {

            password.type = 'text';

            this.textContent = 'Hide';

            this.setAttribute(
                'aria-label',
                'Hide password'
            );

        }

        else {

            password.type = 'password';

            this.textContent = 'Show';

            this.setAttribute(
                'aria-label',
                'Show password'
            );

        }

    });

}


/* =====================================================
   LOAD REMEMBERED EMAIL
===================================================== */

const savedEmail =
    localStorage.getItem('stacklyUserEmail');

const savedRememberMe =
    localStorage.getItem('rememberMe');


if (savedRememberMe === 'true' && savedEmail) {

    const emailInput =
        document.getElementById('l-email');

    const rememberCheckbox =
        document.getElementById('rememberMe');


    if (emailInput) {
        emailInput.value = savedEmail;
    }


    if (rememberCheckbox) {
        rememberCheckbox.checked = true;
    }

}

document.querySelectorAll(".social-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    window.location.href = '404.html'
  })
})
</script>
